<!--
  HOW TO USE THIS SNIPPET
  ------------------------
  1. Open your existing index.html
  2. Find the CONTACT US section (the one with Address / Phone / Email)
  3. Paste the <div class="map-embed">...</div> block below right after the
     contact details, or beside them in a two-column layout.
  4. Replace the src URL with your school's real address:
     - Go to Google Maps → search your school → Share → Embed a map → copy the src URL
-->

<div class="map-embed" style="border-radius:14px;overflow:hidden;box-shadow:0 10px 30px -12px rgba(18,53,36,.18);margin-top:24px;">
  <iframe
    src="https://www.google.com/maps?q=New+Delhi,India&output=embed"
    width="100%"
    height="320"
    style="border:0;display:block;"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    title="Green Valley International School Location">
  </iframe>
</div>
